<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Japanese Pixel-Art Village Simulation (Full HD)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #0b0e14;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }
    #canvas-container {
      position: relative;
      width: 1920px;
      height: 1080px;
      max-width: 100vw;
      max-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: auto;
      box-shadow: 0 16px 56px rgba(0, 0, 0, 0.90);
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="gameCanvas" width="1920" height="1080"></canvas>
  </div>

  <!-- Simulation Engine Modules -->
  <script src="src/config.js"></script>
  <script src="src/assets.js"></script>
  <script src="src/time.js"></script>
  <script src="src/world.js"></script>
  <script src="src/animal.js"></script>
  <script src="src/villager.js"></script>
  <script src="src/guard.js"></script>
  <script src="src/thief.js"></script>
  <script src="src/events.js"></script>
  <script src="src/render.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
